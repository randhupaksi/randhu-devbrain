commands:
  project-scan:
    intent: "Understand the project, stack, instructions, scripts, structure, and key risks."
    mode: read_only
    approval: none
    modules: [workflows/project-discovery.md]
    output: "Findings, context gaps, risk map, and suggested next step."

  context-check:
    intent: "Reconcile material disagreement or possible staleness among the latest request, project instructions, canonical project artifacts, implementation, contracts, tests, and documentation without silently rewriting sources."
    mode: read_only
    approval: none
    modules: [workflows/context-reconciliation.md]
    output: "Conflict map, authority decision, evidence, material uncertainty, and the next authorized action."

  safe-fix:
    intent: "Fix the bug with the smallest complete solution, intentional behavior preservation, and proportionate validation."
    mode: analyze_then_implement
    approval: high_risk_boundary_only
    modules: [workflows/debugging.md]
    output: "Root cause, fix, changed files, and validation."

  done-check:
    intent: "Review the active task's completion against requirements and proportionate evidence without editing files or running mutating checks."
    mode: read_only
    approval: none
    modules: [workflows/definition-of-done.md, workflows/verification-reporting.md]
    output: "Satisfied requirements, unverified or incomplete areas, supporting evidence, and next steps."

  premium-ui:
    intent: "Improve UI polish according to project Visual DNA and design system; reuse or proportionately strengthen the foundation without changing unrequested business logic or APIs."
    mode: analyze_then_implement
    approval: high_risk_boundary_only
    modules: [core/ui-ux-principles.md, core/design-system-intelligence.md, workflows/ui-task.md]

  design-system-scan:
    intent: "Read-only audit of Visual DNA, token/theme source, component library, shared primitives/patterns, duplicate UI, UX states, and project foundation gaps."
    mode: read_only
    approval: none
    modules: [core/design-system-intelligence.md, workflows/ui-foundation-pass.md]
    output: "Visual-system map, reusable-component inventory, gaps, risks, and recommended foundation pass."

  visual-dna-init:
    intent: "Draft Project Visual DNA from project evidence, existing screens, product goals, and design system; do not treat it as a final brand without sufficient context."
    mode: draft_first
    approval: none_if_command_requested
    modules: [core/design-system-intelligence.md]

  ui-foundation:
    intent: "Build or refine the small UI foundation needed by the active feature: semantic tokens, reusable primitives/patterns, states, and consistent composition."
    mode: analyze_then_implement
    approval: high_risk_boundary_only
    modules: [core/design-system-intelligence.md, workflows/ui-foundation-pass.md]

  componentize-ui:
    intent: "Find genuine repeated UI and extract a compatible shared primitive/pattern without fragmentation or speculative abstraction."
    mode: analyze_then_implement
    approval: high_risk_boundary_only
    modules: [core/design-system-intelligence.md, workflows/safe-refactor.md]

  premium-feature-ui:
    intent: "Implement a complete feature UI anchored in the project, design-system-first, responsive, state-aware, accessible, and maintainable without out-of-scope data/API changes."
    mode: analyze_then_implement
    approval: high_risk_boundary_only
    modules: [core/design-system-intelligence.md, workflows/ui-foundation-pass.md, workflows/ui-task.md]

  dashboard-review:
    intent: "Audit dashboard hierarchy, KPIs, tables, filters, states, responsiveness, and usability."
    mode: read_only_by_default
    approval: none_if_implementation_requested

  responsive-pass:
    intent: "Review and improve desktop/tablet/mobile layouts, overflow, touch targets, tables, modals, navigation, and safe areas."
    mode: analyze_then_implement
    approval: high_risk_boundary_only

  perf-check:
    intent: "Find evidence of lag, repeated rendering, fetching issues, bundle size, lazy loading, and cache behavior."
    mode: read_only_by_default
    approval: high_risk_boundary_only
    modules: [core/performance.md]

  api-contract-check:
    intent: "Read and map endpoints, methods, payloads, responses/errors, auth, tenant scope, types, consumers, compatibility, and frontend mapping without changing files."
    mode: read_only
    approval: none_for_non_sensitive_read_only_analysis
    modules: [core/api-backend-intelligence.md, safety/data-and-api-protection.md]
    output: "Contract map, consumer impact, risk/data boundary, compatibility notes, and recommended next step."

  api-feature:
    intent: "Completely implement the endpoints, services, schema/DTO, integration, validation, error behavior, tests, and supporting contract required by the active outcome, preserving compatibility."
    mode: analyze_then_implement
    approval: high_risk_boundary_only
    modules: [core/api-backend-intelligence.md, workflows/api-feature.md, safety/data-and-api-protection.md]

  backend-module:
    intent: "Build or refine a backend module using the project's architecture and real responsibility boundaries, business invariants, validation, data access, error handling, and relevant tests."
    mode: analyze_then_implement
    approval: high_risk_boundary_only
    modules: [core/api-backend-intelligence.md, workflows/api-feature.md]

  contract-impact-check:
    intent: "Read-only audit of API consumer impact, compatibility, error semantics, auth/tenant scope, migrations, and data risk."
    mode: read_only
    approval: none
    modules: [core/api-backend-intelligence.md, safety/data-and-api-protection.md]

  api-hardening:
    intent: "Audit the security boundary and fix requested low-risk issues; request specific confirmation before implementing auth/permission/tenant-security changes."
    mode: analyze_then_implement
    approval: high_risk_boundary_only
    modules: [core/api-backend-intelligence.md, safety/data-and-api-protection.md]

  data-safety-audit:
    intent: "Read-only audit of data classification, secret/PII exposure, authorization, tenant isolation, mutation risk, logging, migrations, and protected boundaries."
    mode: read_only
    approval: none
    modules: [safety/data-and-api-protection.md, safety/risk-model.md]

  migration-plan:
    intent: "Plan a schema/data migration, compatibility, rollback, dry run, validation, and environment/data boundaries without running mutations."
    mode: read_only
    approval: none
    modules: [workflows/safe-data-migration.md, safety/data-and-api-protection.md]

  integration-test:
    intent: "Review or add API integration/contract validation according to risk and the project's test infrastructure."
    mode: analyze_then_implement
    approval: high_risk_boundary_only
    modules: [core/api-backend-intelligence.md, workflows/api-feature.md]

  crud-modal-review:
    intent: "Review CRUD modal/form layout, validation, defaults, submission, loading, errors, and consistency."
    mode: read_only_by_default
    approval: high_risk_boundary_only

  refactor-plan:
    intent: "Plan a refactor, behavior invariants, files, risks, and validation without implementation."
    mode: read_only
    approval: implementation_requires_user_request
    modules: [workflows/safe-refactor.md]

  explain-diff:
    intent: "Explain changes from the diff without changing files."
    mode: read_only
    approval: none

  commit-msg:
    intent: "Suggest a specific English Conventional Commit message for one logical change; do not run Git."
    mode: text_only
    approval: none
    forbidden: [git_add, git_commit, git_push]

  git-command-list:
    intent: "Inspect Git read-only, then produce a text-only command list grouped by feature/logical change: specific git add paths, detailed English Conventional Commit messages, and one git push at the end."
    mode: text_only_after_read_only_inspection
    approval: none
    modules: [workflows/git-command-listing.md, safety/policy.md]
    forbidden: [git_add, git_commit, git_push]
    output: "Feature groups, outcome summaries, specific git add paths, detailed commit messages, one text-only git push, and scope/upstream notes when needed."

  agents-init:
    intent: "Draft project instructions from a template based on project inspection and user input."
    mode: draft_first
    approval: none_if_command_requested

  devbrain-sync:
    intent: "Compare a source specification or new experience with DevBrain and propose changes."
    mode: apply_if_user_requested_update
    approval: required_only_for_ambiguous_or_high_risk_safety_change

  notify-done:
    intent: "Local notification after a task."
    mode: disabled
    reason: "The notification system was deferred from the initial foundation."
