schema: devbrain-benchmark
version: 1
reference_commit: 0ba2c97907e6135fd24179f633d918f50e770c1f
cases:
  - id: enterprise-ui
    fixture: enterprise
    prompt: Improve the operations table so the primary task and filtered results are clear on desktop and mobile. Implement the changes in the fixture.
    evidence: Compare task priority, keyboard and selection behavior, responsive layout, and the empty filter state with browser evidence.
  - id: portfolio-ui
    fixture: marketing
    prompt: Build the portfolio described in the fixture, with a visual direction that makes the project work easy to understand.
    evidence: Inspect hierarchy, typography, mobile reflow, and fidelity to the supplied work and outcomes.
  - id: creative-ui
    fixture: creative-editor
    prompt: Build a small working caption editor using the supplied brief and content. Keep the preview central and make cancellation and recovery clear.
    evidence: Check editing, cancel, confirmation, recovery, keyboard use, narrow layout, and reduced motion if motion is present.
  - id: copy-default
    fixture: product-copy
    prompt: Write the interface messages requested by the brief. Return the requested labels and copy.
    evidence: Check state meaning, the user's next step, required placeholders, and natural concise language.
  - id: copy-editorial
    fixture: product-copy
    prompt: Deeply edit the draft messages in the brief for an approachable product voice. Return the requested labels and copy.
    evidence: Check substantive editorial improvements, accuracy, placeholders, and voice fidelity.
  - id: fullstack-implementation
    fixture: delivery-board
    prompt: Implement the shipment board described in the fixture, including the browser UI and local backend. Verify the key behavior using the available project tools.
    evidence: Exercise both endpoints, rejected input, persisted status after refresh within the server process, and client loading, error and empty states.
  - id: contract-boundary
    fixture: api-contract
    prompt: Review the feasibility of renaming the public name field to displayName. Use the existing implementation and consumers to explain the impact and suggest a migration. Keep the fixture read-only.
    evidence: Verify reachable consumer effects, compatibility option, calibrated uncertainty, and an empty edit set.
  - id: resume-and-verify
    fixture: continuity
    prompt: Resume the authorized label-normalizer fix from the handoff. Check the current source and run the relevant verification after fixing it.
    evidence: Verify user edits are preserved, current checks actually ran, and historical claims retain their original scope.
  - id: technical-choice
    fixture: technical-choice
    prompt: "Compare the two synthetic caching adapters using the supplied release notes and the project's installed version. Return a recommendation only."
    evidence: "Check installed version, source anchors, recommendation limits, and an empty edit set."
  - id: checkout-discovery
    fixture: checkout-brief
    prompt: "Turn the supplied equipment checkout brief into a scoped first release and observable acceptance criteria. Keep it at the planning stage."
    evidence: "Verify scoped success/recovery criteria and that eligibility stays an open decision."
  - id: frontend-journey
    fixture: inventory-lookup
    prompt: "Add the inventory lookup journey to the supplied frontend fixture. Use its existing API and preserve adjacent navigation."
    evidence: "Verify the new route, filtering, no matches, retry, keyboard use and preserved server files."
  - id: grounded-assistant
    fixture: grounded-assistant
    prompt: "Design a source-grounded assistant for the supplied knowledge base brief. Keep the task read-only and use the local synthetic examples."
    evidence: "Inspect retrieval authorization, citation verification, cancellation, abstention and negative checks without a live provider."
  - id: greenfield-plan
    fixture: delivery-board
    prompt: "Plan the greenfield shipment board from its brief. Return the delivery sequence and acceptance checks without implementing it."
    evidence: "Check the runnable slice, API and persistence contract, failure recovery, planned verification and an empty edit set."
