schema: devbrain-manifest
version: 2.6.0-rc.1
owner: Randhu Paksi
status: native_validation_pending
updated_on: 2026-10-14
language: en
purpose: Personal developer knowledge layer for AI coding assistants
scoped_validation:
  codex_cli_non_ui:
    status: stable
    interface: Codex CLI 0.164.0
    requested_model: gpt-5.6-sol
    reviewed_pass_count: 9
    excluded_ui_cases: [18-enterprise-routing, 19-marketing-routing, 41-context-latest-user-decision]
    ui_follow_up: v2.7
    claude_validation: pending

always_load:
  - runtime/session-baseline.md
task_router: runtime/task-map.md
loading_policy:
  session_load: once_per_coding_session
  reuse_active_context: true
  reload_on: [explicit_request, material_context_loss, devbrain_update, repository_change, uncertain_active_rules]
  full_tree_scan: forbidden_during_normal_coding
  skill_directory_scan: forbidden_at_startup
  skill_references: only_when_needed
  excluded_from_normal_coding: [source, adapters, project-templates, docs, evaluation, CHANGELOG.md]
  maintenance_exception: explicit_audit_or_update_request

bootstrap:
  installer: install/install-bootstrap.ps1
  updater: install/update-bootstrap.ps1
  supported_tools: [codex, claude]
  path_strategy: repository_root_and_user_home_detection
  preserve_outside_managed_block: true
  backup_before_update: true
  execution: explicit_install_request_only
  codex_template: adapters/codex/AGENTS.global.template.md
  claude_template: adapters/claude-code/CLAUDE.global.template.md

skills:
  - enterprise-ui-ux
  - marketing-portfolio-ui-ux
  - design-system-architect
  - architecture-refactor
  - frontend-performance
  - accessibility-audit
  - testing-strategy

project_context_candidates: [AGENTS.md, CLAUDE.md, PROJECT-CONTEXT.md, README.md]
evaluation:
  scenarios: evaluation/scenarios.yaml
  guide: evaluation/README.md
  static_validator: evaluation/validate-repository.ps1
  installer_tests: evaluation/test-installer.ps1
  content_regressions: evaluation/test-content-regressions.cjs
  smoke_suite: evaluation/smoke-suite.yaml
  scorecard_contract: evaluation/scorecard-contract.yaml
  smoke_preparation: evaluation/prepare-smoke.cjs
  result_validator: evaluation/validate-results.cjs
  result_tests: evaluation/test-behavior-results.cjs
  failure_taxonomy: evaluation/failure-taxonomy.yaml
  host_preflight: evaluation/host-preflight.cjs
  codex_native_capture: evaluation/run-codex-case.cjs
  native_capture_tests: evaluation/test-native-capture.cjs

deferred_capabilities: [cli, exe, daemon, database, notification_system, task_logs, daily_summary, gui]
source_specification:
  file: source/DevBrain_v2_Developer_Context_Specification.docx
  role: generalized_conceptual_reference_not_active_policy
  revised_on: 2026-09-28
  sha256: 26e94fdf03c5fa9b503de40580781bfa610fe544331b56818eedb42c2c406435
